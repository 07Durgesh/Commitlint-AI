<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CommitLint.ai — AI Git Commit & PR Generator</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="logo-area">
        <span class="logo-icon">⚡</span>
        <h1>CommitLint<span>.ai</span></h1>
      </div>
      <p class="tagline">Turn raw git diffs into clean Conventional Commits & structured PR descriptions.</p>
    </header>

    <main class="main-content">
      <!-- Input Section -->
      <section class="card input-card">
        <div class="card-header">
          <h2>Git Diff Input</h2>
          <button id="sample-diff-btn" class="btn-text" type="button">📋 Load Sample Diff</button>
        </div>

        <textarea 
          id="diff-input" 
          placeholder="Paste your 'git diff' output here (e.g. diff --git a/main.go b/main.go)..." 
          rows="10" 
          spellcheck="false"
        ></textarea>

        <div class="options-bar">
          <div class="input-group">
            <label for="context-input">Optional Context</label>
            <input 
              type="text" 
              id="context-input" 
              placeholder="e.g. fixing race condition in rate limiter"
            />
          </div>

          <div class="input-group">
            <label for="style-select">Commit Style</label>
            <select id="style-select">
              <option value="conventional" selected>Conventional Commits (feat, fix, etc.)</option>
              <option value="angular">Angular Style</option>
              <option value="simple">Simple / Concise</option>
            </select>
          </div>

          <button id="analyze-btn" class="btn-primary" type="button">
            <span class="btn-text-content">✨ Generate Commit & PR</span>
            <span class="spinner" hidden></span>
          </button>
        </div>

        <div id="error-banner" class="error-banner" hidden></div>
      </section>

      <!-- Results Section -->
      <section id="results-section" class="results-grid" hidden>
        <!-- Commit Message Card -->
        <div class="card result-card">
          <div class="card-header">
            <h3>📝 Suggested Commit Message</h3>
            <button class="btn-copy" data-target="commit-full" type="button">Copy</button>
          </div>
          <div class="commit-subject-box">
            <span class="label">Subject</span>
            <code id="commit-subject"></code>
          </div>
          <div class="commit-body-box" id="commit-body-wrapper">
            <span class="label">Body</span>
            <pre><code id="commit-body"></code></pre>
          </div>
          <input type="hidden" id="commit-full" />
        </div>

        <!-- PR Description Card -->
        <div class="card result-card">
          <div class="card-header">
            <h3>📄 PR Description</h3>
            <button class="btn-copy" data-target="pr-full" type="button">Copy Markdown</button>
          </div>
          <pre class="pr-preview"><code id="pr-full"></code></pre>
        </div>

        <!-- Observations Card -->
        <div class="card result-card observations-card" id="observations-card">
          <div class="card-header">
            <h3>💡 Code Observations & Review Notes</h3>
          </div>
          <div id="observations-list" class="observations-list"></div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <p>CommitLint.ai &bull; Built with Go stdlib &amp; Gemini API &bull; <span id="health-status">Checking backend...</span></p>
    </footer>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
