name: Continuous Integration

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-and-verify:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true
          cache: true
          cache-dependency-path: go.sum

      - name: Verify Dependencies
        run: go mod verify

      - name: Run Go Vet (Static Analysis)
        run: go vet ./...

      - name: Run Unit Tests with Coverage
        run: go test -v -coverprofile=coverage.out ./...

      - name: Build Server Binary
        run: |
          go build -ldflags "-X main.Version=${{ github.ref_name }} -X main.Commit=${{ github.sha }}" -o bin/server cmd/server/main.go

      - name: Build CLI Binary
        run: |
          go build -ldflags "-X main.Version=${{ github.ref_name }} -X main.Commit=${{ github.sha }}" -o bin/commitlint-cli cmd/cli/main.go

      - name: Build Vercel API Functions
        run: |
          go build ./api/analyze
          go build ./api/health
